<div class="selector">
  <div class="modes" role="radiogroup" aria-label="Mode">
    @for (m of modes; track m.id) {
      <button
        type="button"
        role="radio"
        class="mode"
        [class.active]="m.id === mode()"
        [attr.aria-checked]="m.id === mode()"
        (click)="setMode(m.id)"
      >{{ m.label }}</button>
    }
  </div>

  <div class="slider">
    <input
      #range
      type="range"
      min="0"
      step="1"
      [max]="notches().length - 1"
      [value]="index()"
      [attr.aria-valuetext]="valueText()"
      aria-label="Test length"
      (input)="setIndex(range.value)"
    >
    <ol class="notches" aria-hidden="true">
      @for (n of notches(); track n; let i = $index) {
        <li [class.active]="i === index()" [style.left.%]="(i / (notches().length - 1)) * 100">{{ n }}</li>
      }
    </ol>
  </div>

  @if (isCustom()) {
    <label class="custom">
      <input
        #custom
        type="number"
        inputmode="numeric"
        step="1"
        [min]="limits().min"
        [max]="limits().max"
        [value]="customValue()"
        [attr.aria-label]="'Custom number of ' + unit()"
        (change)="setCustom(custom)"
      >
      <span class="hint">{{ limits().min }} - {{ limits().max }} {{ unit() }}</span>
    </label>
  }
</div>
